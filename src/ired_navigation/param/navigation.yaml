amcl:
  ros__parameters:
    alpha1: 0.4
    alpha2: 0.4
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1

    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map

    robot_model_type: nav2_amcl::OmniMotionModel

    laser_model_type: likelihood_field
    laser_min_range: -1.0
    laser_max_range: 6.0
    laser_likelihood_max_dist: 3.5
    sigma_hit: 0.12

    max_beams: 100
    max_particles: 1000
    min_particles: 300

    pf_err: 0.05
    pf_z: 0.99

    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001

    resample_interval: 1

    z_hit: 0.65
    z_max: 0.05
    z_rand: 0.25
    z_short: 0.05
    lambda_short: 0.1

    do_beamskip: false

    save_pose_rate: 2.0

    tf_broadcast: true
    transform_tolerance: 0.5

    update_min_a: 0.15
    update_min_d: 0.08

    scan_topic: scan_filtered
    map_topic: map

    # Set initial pose manually with RViz 2D Pose Estimate
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.5

    default_nav_to_pose_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"

    default_nav_through_poses_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"

    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path

    navigators:
      - navigate_to_pose
      - navigate_through_poses

    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

    error_code_name_prefixes:
      - assisted_teleop
      - backup
      - compute_path
      - dock_robot
      - drive_on_heading
      - follow_path
      - nav_thru_poses
      - nav_to_pose
      - route
      - spin
      - undock_robot
      - wait

docking_server:
  ros__parameters:
    dock_plugins:
      - nova_carter_dock

    nova_carter_dock:
      plugin: opennav_docking::SimpleChargingDock

    docks:
      - home_dock
      - flex_dock1
      - flex_dock2

    home_dock:
      type: nova_carter_dock
      frame: map
      pose: [0.0, 0.0, 0.0]

    flex_dock1:
      type: nova_carter_dock
      frame: map
      pose: [10.0, 10.0, 0.0]

    flex_dock2:
      type: nova_carter_dock
      frame: map
      pose: [30.0, 30.0, 0.0]

    enable_stamped_cmd_vel: true

controller_server:
  ros__parameters:
    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins:
      - progress_checker

    goal_checker_plugins:
      - goal_checker

    controller_plugins:
      - FollowPath

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.10

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner

      debug_trajectory_details: false

      # ============================================================
      # Omniwheel robot
      # ============================================================

      min_vel_x: -0.8
      max_vel_x: 0.8

      min_vel_y: -0.8
      max_vel_y: 0.8

      min_vel_theta: -1.2
      max_vel_theta: 1.2

      min_speed_xy: 0.0
      max_speed_xy: 0.8

      min_speed_theta: 0.0
      max_speed_theta: 0.8

      # ============================================================
      # Acceleration
      # ============================================================

      acc_lim_x: 3.5
      acc_lim_y: 3.5
      acc_lim_theta: 2.2

      decel_lim_x: -3.5
      decel_lim_y: -3.5
      decel_lim_theta: -2.2

      # ============================================================
      # Sampling
      # ============================================================

      vx_samples: 8
      vy_samples: 8
      vtheta_samples: 10

      sim_time: 0.6

      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.2

      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.05

      short_circuit_trajectory_evaluation: true
      stateful: true

      # ============================================================
      # Critics
      #
      # No PathAlign / GoalAlign:
      # robot is allowed to move sideways without rotating.
      #
      # BaseObstacle handles local obstacle avoidance.
      # RotateToGoal handles final orientation.
      # ============================================================

      critics:
        - RotateToGoal
        - Twirling
        - Oscillation
        - BaseObstacle
        - PathDist
        - GoalDist

      BaseObstacle.scale: 10.0
      PathDist.scale: 60.0
      GoalDist.scale: 24.0

      RotateToGoal.scale: 10.0
      RotateToGoal.slowing_factor: 1.0
      RotateToGoal.lookahead_time: -1.0

      Twirling.scale: 1.0

    enable_stamped_cmd_vel: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      robot_base_frame: base_footprint

      rolling_window: true

      width: 3
      height: 3
      resolution: 0.05

      # Actual radius = 0.215 m
      # Use 0.23 m conservatively.
      robot_radius: 0.23

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer

        observation_sources: scan

        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0

          clearing: true
          marking: true

          data_type: LaserScan

          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

          obstacle_max_range: 3.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer

        # Gives DWB a useful safety buffer around obstacles.
        inflation_radius: 0.35
        cost_scaling_factor: 5.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: map
      robot_base_frame: base_footprint

      transform_tolerance: 0.5

      # Actual radius = 0.215 m
      # Use 0.23 m conservatively.
      robot_radius: 0.23

      resolution: 0.05

      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer

        map_subscribe_transient_local: true
        transform_tolerance: 0.1

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer

        observation_sources: scan

        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0

          clearing: true
          marking: true

          data_type: LaserScan

          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

          obstacle_max_range: 3.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer

        # Give the global planner some obstacle clearance too.
        inflation_radius: 0.35
        cost_scaling_factor: 10.0

      always_send_full_costmap: true

map_server:
  ros__parameters:
    yaml_filename: map.yaml

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner

      tolerance: 0.5
      use_astar: false
      allow_unknown: true

      # Do not force the robot to face the final path direction.
      use_final_approach_orientation: false

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint

    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait
      - assisted_teleop

    spin:
      plugin: nav2_behaviors::Spin

    backup:
      plugin: nav2_behaviors::BackUp

    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading

    wait:
      plugin: nav2_behaviors::Wait

    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop

    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint

    transform_timeout: 0.1
    simulate_ahead_time: 2.0

    max_rotational_vel: 1.2
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

    enable_stamped_cmd_vel: true

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false

    waypoint_task_executor_plugin: wait_at_waypoint

    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

collision_monitor:
  ros__parameters:
    enabled: true

    base_frame_id: base_footprint
    odom_frame_id: odom

    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel

    state_topic: collision_monitor_state

    transform_tolerance: 0.5
    source_timeout: 5.0

    base_shift_correction: true
    stop_pub_timeout: 2.0

    enable_stamped_cmd_vel: true
    use_realtime_priority: false

    observation_sources:
      - scan

    scan:
      source_timeout: 0.5
      type: scan
      topic: /scan_filtered
      enabled: true

    # ============================================================
    # Collision zones
    #
    # Robot radius = 0.23 m
    #
    # Slow down before reaching the robot footprint.
    # Stop before actually reaching the robot footprint.
    # ============================================================

    polygons:
      - PolygonStop
      - PolygonSlow
      - FootprintApproach

    PolygonStop:
      type: circle

      # Emergency stop zone.
      # Larger than the 0.23 m physical radius.
      radius: 0.28

      action_type: stop
      min_points: 4

      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true

    PolygonSlow:
      type: circle

      # Start slowing down well before the stop zone.
      radius: 0.33

      action_type: slowdown
      min_points: 4

      slowdown_ratio: 0.3

      visualize: true
      polygon_pub_topic: polygon_slowdown
      enabled: true

    FootprintApproach:
      type: polygon
      action_type: approach

      footprint_topic: /local_costmap/published_footprint

      time_before_collision: 2.0
      simulation_time_step: 0.02

      min_points: 6

      visualize: false
      enabled: true

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0

    scale_velocities: false

    feedback: OPEN_LOOP

    # vx, vy, wz
    max_velocity: [0.8, 0.8, 1.2]
    min_velocity: [-0.8, -0.8, -1.2]

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0

    max_accel: [3.5, 3.5, 2.2]
    max_decel: [-3.5, -3.5, -2.2]

    odom_topic: odom
    odom_duration: 0.1

    use_realtime_priority: false

    enable_stamped_cmd_vel: true
